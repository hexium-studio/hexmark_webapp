# Release: on a pushed tag vX.Y.Z (or vX.Y.Z-pre) that points to a commit on
# main. Builds both images for linux/amd64 and linux/arm64 on native runners,
# pushes them to GHCR and creates a GitHub Release. See docs/releasing.md.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      # Full history incl. all branches, so origin/main is available below.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag name and that the commit is on main
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version tag vX.Y.Z or vX.Y.Z-pre. Nothing is released."
            exit 1
          fi
          if ! git rev-parse --verify --quiet origin/main > /dev/null; then
            echo "::error::Branch main was not fetched; cannot check where tag '$TAG' points."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points to $GITHUB_SHA, which is not on main. Releases are tagged on main only: merge dev into main first, then tag the merge commit."
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Tag '$TAG' ($GITHUB_SHA) is on main."

  # The tagged commit already passed CI (the full `pnpm test:all`) on its way
  # into main. This gate repeats only the fast checks as a last sanity check;
  # integration and e2e tests would add minutes without new information, and
  # the image builds below build the code again anyway.
  checks:
    name: checks (fast)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint, typecheck, check:translations, check:docs, unit tests.
      - name: Run fast checks
        run: node tools/run-checks.mjs release

  # One leg per image and platform, each on a native runner (no QEMU). A leg
  # pushes its single-platform image by digest only (no tag) and hands the
  # digest to the `manifest` job, which tags the multi-arch index.
  images:
    name: image (${{ matrix.image }}, ${{ matrix.arch }})
    needs: [verify, checks]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [server, web]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: server
            title: Hexmark server
            description: Hexmark server – HTTP API and MCP server of Hexmark, a self-hosted wiki for agents first, humans second.
          - image: web
            title: Hexmark web
            description: Hexmark web – browser UI of Hexmark, a self-hosted wiki for agents first, humans second.
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          # Free for public repositories; a private repository needs a paid
          # plan for arm64 runners.
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Image names must be lower case; the owner name may not be.
      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: echo "image=ghcr.io/${OWNER,,}/hexmark-${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels and manifest annotations for the platform image. The tags
      # config is the same as in the `manifest` job so that the version label
      # matches; the tags themselves are set only on the index.
      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # One cache scope per image and architecture; a shared scope would
          # let the two legs overwrite each other's cache.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Per image: combine the platform digests into one multi-arch index and tag
  # it. Tags from the git tag vX.Y.Z: X.Y.Z, X.Y and latest. A pre-release
  # (vX.Y.Z-pre) gets only X.Y.Z-pre: no X.Y and no latest.
  manifest:
    name: manifest (${{ matrix.image }})
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: server
            title: Hexmark server
            description: Hexmark server – HTTP API and MCP server of Hexmark, a self-hosted wiki for agents first, humans second.
          - image: web
            title: Hexmark web
            description: Hexmark web – browser UI of Hexmark, a self-hosted wiki for agents first, humans second.
    steps:
      - name: Download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: echo "image=ghcr.io/${OWNER,,}/hexmark-${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Annotations on the index, so GHCR shows the description.
      - name: Image tags and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Create and push the multi-arch index
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          shopt -s nullglob
          digests=(*)
          if (( ${#digests[@]} != 2 )); then
            echo "::error::Expected 2 platform digests for $IMAGE, found ${#digests[@]}."
            exit 1
          fi
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$META_JSON")
          while IFS= read -r annotation; do
            args+=(--annotation "$annotation")
          done < <(jq -r '.annotations[]' <<< "$META_JSON")
          for digest in "${digests[@]}"; do
            args+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Check that both platforms are in the index
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          platforms=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' \
            | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"')
          for platform in linux/amd64 linux/arm64; do
            if ! grep -qx "$platform" <<< "$platforms"; then
              echo "::error::$IMAGE:$VERSION has no $platform image."
              exit 1
            fi
          done
          echo "$IMAGE:$VERSION has linux/amd64 and linux/arm64."

  release:
    name: GitHub release
    needs: [verify, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          args=(--verify-tag --generate-notes --title "Hexmark ${TAG#v}")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"
