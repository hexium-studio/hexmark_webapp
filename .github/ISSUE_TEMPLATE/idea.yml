name: Idea or feature request
description: Suggest an improvement. There is no guarantee it will be implemented.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Hexmark deliberately stays small – a wiki for agents and humans.
        Every idea is read, but not every idea will be implemented.
        Requests outside this scope (project boards, tasks, other modules) will be closed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I have read CONTRIBUTING.md and understand that this request may not be implemented.
          required: true
